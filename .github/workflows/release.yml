name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out the merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          first_semver_tag() {
            git tag --sort=-version:refname "$@" |
              awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && !found { print; found = 1 }'
          }

          tag="$(first_semver_tag --points-at "$RELEASE_SHA")"

          if [[ -z "$tag" ]]; then
            latest="$(first_semver_tag)"
            if [[ -z "$latest" ]]; then
              tag="v1.0.0"
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              tag="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "$tag" \
            --generate-notes
