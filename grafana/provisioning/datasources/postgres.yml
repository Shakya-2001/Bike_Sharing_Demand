apiVersion: 1

datasources:
  - name: Bike Sharing PostgreSQL
    uid: bike-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: $POSTGRES_USER
    isDefault: true
    editable: false
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1700
      timeInterval: 1m
    secureJsonData:
      password: $POSTGRES_PASSWORD